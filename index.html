<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="apple-mobile-web-app-capable" content="yes">

<title>FMÖ Angebot</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230B1A3D'/%3E%3Cpath d='M22 14c-6 9-9 14-9 19a9 9 0 0 0 18 0c0-5-3-10-9-19z' fill='%231AA3E8'/%3E%3Cpath d='M42 12c-2 8 6 11 6 20a9 9 0 0 1-18 0c0-6 5-8 5-14 3 2 4 5 4 7 2-3 3-8 3-13z' fill='%23E8202A'/%3E%3Ctext x='32' y='58' font-family='Arial' font-weight='700' font-size='14' fill='%23fff' text-anchor='middle'%3EFM%C3%96%3C/text%3E%3C/svg%3E">
<style>
:root{--navy:#0B1A3D;--navy2:#16295a;--red:#E8202A;--blue:#1AA3E8;--bg:#eef1f6;--card:#fff;--line:#d9dfea;--muted:#64708a;--ok:#16924f;--warn:#d98b0b;--r:12px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--navy);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
a{color:var(--blue)}
button{font:inherit;cursor:pointer;color:inherit}
.appbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;height:56px;padding:0 12px;background:var(--navy);color:#fff;border-bottom:3px solid var(--red)}
.appbar img{height:38px;max-width:96px;object-fit:contain;background:#fff;border-radius:6px;padding:2px}
.brand{display:flex;flex-direction:column;line-height:1.1;min-width:0}
.brand b{font-size:16px;white-space:nowrap}
.brand small{font-size:11px;color:#b9c6e4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grow{flex:1}
.chip{border:0;border-radius:999px;background:var(--blue);color:#fff;padding:6px 11px;font-size:12px;font-weight:600;white-space:nowrap;max-width:46vw;overflow:hidden;text-overflow:ellipsis}
.chip:empty{display:none}
.tabbar{position:fixed;bottom:0;left:0;right:0;z-index:25;display:flex;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0 8px;font-size:11px;font-weight:600;color:var(--muted);text-decoration:none}
.tabbar a svg{width:24px;height:24px}
.tabbar a.on{color:var(--navy)}
.tabbar a.on svg{color:var(--red)}
main{padding:12px;padding-bottom:96px;max-width:1100px;margin:0 auto}
@media(min-width:900px){
 .tabbar{top:56px;bottom:0;right:auto;width:210px;flex-direction:column;border-top:0;border-right:1px solid var(--line);padding-top:12px}
 .tabbar a{flex:none;flex-direction:row;gap:12px;padding:12px 20px;font-size:15px}
 main{margin-left:210px;padding:20px 24px 40px}
 body.wide main{max-width:none}
}
h2{font-size:20px;margin:4px 0 12px}
h3{font-size:16px;margin:0 0 8px}
.card{background:var(--card);border-radius:var(--r);padding:12px;margin-bottom:12px;box-shadow:0 1px 3px rgba(11,26,61,.09)}
.muted{color:var(--muted)}.small{font-size:12px}.right{text-align:right}.nowrap{white-space:nowrap}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.nw{flex-wrap:nowrap}
.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:600;background:#e3e8f1;color:var(--navy);display:inline-flex;align-items:center;gap:6px;justify-content:center;text-decoration:none;font-size:14px}
.btn:active{filter:brightness(.92)}
.btn.p{background:var(--navy);color:#fff}.btn.r{background:var(--red);color:#fff}.btn.b{background:var(--blue);color:#fff}.btn.g{background:transparent;border:1px solid var(--line)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn[disabled]{opacity:.5}
.ib{border:0;background:transparent;border-radius:8px;width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;font-size:17px;color:var(--navy);flex:none}
.ib:active{background:#e3e8f1}
.ib.add{background:var(--red);color:#fff;font-size:22px;font-weight:700;width:40px;height:40px;border-radius:10px}
.ib.star{color:#c6cdda}.ib.star.on{color:#f2b01e}
input,select,textarea{font:inherit;font-size:16px;width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:inherit;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--blue);outline-offset:-1px;border-color:var(--blue)}
textarea{resize:vertical;min-height:42px}
input[type=checkbox]{width:auto;transform:scale(1.25);margin:0 6px 0 2px}
label.f{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:9px 0 3px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 10px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:0 8px}
@media(max-width:560px){.g3.rs,.g2.rs{grid-template-columns:1fr}}
.span2{grid-column:span 2}
details.card>summary{cursor:pointer;font-weight:700;font-size:16px;list-style:none;display:flex;align-items:center;gap:8px}
details.card>summary::before{content:"▸";color:var(--red);transition:transform .15s}
details.card[open]>summary::before{transform:rotate(90deg)}
details.card>summary::-webkit-details-marker{display:none}
.badge{display:inline-block;border-radius:999px;padding:2px 9px;font-size:11px;font-weight:700;background:#e3e8f1;color:var(--navy);white-space:nowrap}
.st-entwurf{background:#e3e8f1;color:#46506a}.st-gesendet{background:#d9effb;color:#0a6aa0}.st-angenommen{background:#d8f2e3;color:#0f7a40}.st-abgelehnt{background:#fbe0e1;color:#b3121a}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;white-space:nowrap}
.chips button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.fab{position:fixed;right:16px;bottom:calc(78px + env(safe-area-inset-bottom));z-index:24;border:0;border-radius:16px;background:var(--red);color:#fff;font-weight:700;padding:14px 18px;box-shadow:0 6px 16px rgba(232,32,42,.35);font-size:15px}
@media(min-width:900px){.fab{bottom:24px;right:28px}}
.list .item{display:flex;gap:10px;align-items:center;padding:11px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.list .item:last-child{border-bottom:0}
.list .item:active{background:#f4f6fa}
.oitem .t1{font-weight:700}.oitem .t2{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.oitem .sum{font-weight:700;text-align:right;white-space:nowrap}
.empty{text-align:center;padding:28px 12px;color:var(--muted)}
.empty b{display:block;color:var(--navy);font-size:17px;margin-bottom:6px}
/* Material */
.searchbox{position:relative}
.searchbox input{padding-left:38px;font-size:17px;height:48px;border-radius:12px;border:2px solid var(--navy)}
.searchbox::before{content:"";position:absolute;left:13px;top:15px;width:13px;height:13px;border:2.5px solid var(--navy);border-radius:50%}
.searchbox::after{content:"";position:absolute;left:26px;top:29px;width:7px;height:2.5px;background:var(--navy);transform:rotate(45deg)}
.mrow{display:flex;gap:8px;align-items:center;padding:10px;border-bottom:1px solid var(--line)}
.mrow:last-child{border-bottom:0}
.mmain{flex:1;min-width:0;cursor:pointer}
.mt{font-weight:650;line-height:1.25}
.ms{font-size:13px;color:#39445e}
.mm{font-size:12px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mm b{color:var(--navy)}
.mpr{text-align:right;white-space:nowrap;font-size:13px}
.mpr .vk{font-weight:700;font-size:15px}
.mpr .ek{color:var(--muted);font-size:12px}
.banner{background:var(--navy);color:#fff;border-radius:var(--r);padding:9px 12px;margin-bottom:10px;display:flex;align-items:center;gap:8px;font-size:14px}
.banner .btn{background:#fff;color:var(--navy)}
/* Editor */
.ed-top{position:sticky;top:56px;z-index:15;background:var(--bg);padding:8px 0;margin:-12px 0 6px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
@media(min-width:900px){.ed-top{margin-top:-20px}}
.titel{background:#fff;border-radius:var(--r);margin-bottom:12px;box-shadow:0 1px 3px rgba(11,26,61,.09);overflow:hidden}
.titel-h{display:flex;align-items:center;gap:6px;padding:8px 8px 8px 12px;background:var(--navy);color:#fff}
.titel-h .tn{font-weight:800;min-width:22px}
.titel-h input{background:transparent;border:1px solid transparent;color:#fff;font-weight:700;padding:6px 8px}
.titel-h input:focus{background:#fff;color:var(--navy)}
.titel-h .ib{color:#fff}
.titel-h .ts{font-weight:700;white-space:nowrap;font-size:14px}
.tbody{padding:6px 8px;min-height:30px}
.pos{border:1px solid var(--line);border-radius:10px;padding:8px;margin:6px 0;background:#fff;position:relative}
.pos.dragging{opacity:.4}
.pos.drop-before{box-shadow:0 -3px 0 var(--blue)}
.pos.drop-after{box-shadow:0 3px 0 var(--blue)}
.pos-h{display:flex;align-items:center;gap:4px;margin-bottom:6px}
.pos-h .pnr{font-weight:800;min-width:34px}
.handle{cursor:grab;color:#a4adc0;font-size:18px;padding:0 4px;user-select:none;touch-action:none}
.typ-mat{border-left:4px solid var(--blue)}.typ-arb{border-left:4px solid var(--red)}.typ-pausch{border-left:4px solid var(--navy)}.typ-text{border-left:4px solid #b9c2d3;background:#fafbfd}
.pos textarea{min-height:40px;font-size:15px}
.pnums{display:grid;grid-template-columns:1fr .8fr 1.1fr 1.1fr;gap:6px;margin-top:6px;align-items:end}
.pnums label{font-size:11px;color:var(--muted);font-weight:600;display:block;margin-bottom:2px}
.pnums input{padding:7px 8px;text-align:right}
.pnums input.l{text-align:left}
.out{padding:7px 8px;text-align:right;font-weight:700;background:#f2f4f8;border-radius:8px;white-space:nowrap}
.int{background:#fff7e8!important}
.pint{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:6px;padding:6px;border-radius:8px;background:#fff7e8;align-items:end}
.pint label{font-size:11px;color:#8a6412;font-weight:600;display:block;margin-bottom:2px}
.pint input{padding:6px 8px;text-align:right}
.pint .out{background:transparent;color:#8a6412}
body.nointern .intern{display:none!important}
.addrow{display:flex;gap:6px;flex-wrap:wrap;padding:6px 8px 10px}
.totals{width:100%;border-collapse:collapse}
.totals td{padding:6px 4px;border-bottom:1px solid var(--line)}
.totals td:last-child{text-align:right;font-weight:600;white-space:nowrap}
.totals tr.big td{font-size:17px;font-weight:800;border-bottom:0;color:var(--navy)}
.totals tr.intern td{color:#8a6412;background:#fff7e8}
.totals input,.totals select{padding:5px 7px;width:auto}
@media(min-width:900px){.pos-grid{display:grid;grid-template-columns:1fr 330px;gap:12px;align-items:start}.pos-grid .side{position:sticky;top:120px}}
/* Dialog */
.ovl{position:fixed;inset:0;z-index:200;background:rgba(11,26,61,.55);display:flex;align-items:flex-end;justify-content:center}
.dlg{background:#fff;width:100%;max-width:560px;max-height:92vh;border-radius:16px 16px 0 0;display:flex;flex-direction:column;animation:up .18s ease-out}
.dlg.wide{max-width:860px}
@keyframes up{from{transform:translateY(30px);opacity:.4}}
@media(min-width:700px){.ovl{align-items:center}.dlg{border-radius:16px}}
.dlg-h{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line);font-size:16px}
.dlg-h b{flex:1}
.dlg-b{padding:4px 14px 14px;overflow:auto}
.dlg-f{display:flex;gap:8px;justify-content:flex-end;padding:10px 14px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);flex-wrap:wrap}
.dlg-f:empty{display:none}
.bar{height:12px;background:#e3e8f1;border-radius:6px;overflow:hidden;margin:14px 0 8px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--navy));transition:width .15s}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);opacity:0;z-index:300;background:var(--navy);color:#fff;padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;pointer-events:none;transition:.2s;max-width:90vw;text-align:center;border-left:4px solid var(--red)}
#toast.on{opacity:1;transform:translateX(-50%)}
table.simple{width:100%;border-collapse:collapse;font-size:13px}
table.simple td,table.simple th{padding:5px 6px;border-bottom:1px solid var(--line);text-align:left}
.logo-prev{height:70px;max-width:220px;object-fit:contain;border:1px dashed var(--line);border-radius:8px;padding:4px;background:#fff}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
.kv span:nth-child(odd){color:var(--muted)}
/* ============ Druck / Vorschau ============ */
#print{display:none}
#print.preview{display:block;position:fixed;inset:0;z-index:150;overflow:auto;background:#4a5268;padding:60px 8px 30px}
.pv-bar{position:fixed;top:0;left:0;right:0;z-index:151;display:flex;gap:8px;align-items:center;padding:8px 12px;background:var(--navy);color:#fff;border-bottom:3px solid var(--red)}
.sheet{-webkit-print-color-adjust:exact;print-color-adjust:exact;width:210mm;min-height:297mm;margin:0 auto 16px;background:#fff;color:#111;padding:15mm 20mm 30mm 25mm;position:relative;font:9.5pt/1.35 Arial,Helvetica,sans-serif;box-shadow:0 4px 20px rgba(0,0,0,.4)}
.pv-head{height:30mm;display:flex;justify-content:space-between;align-items:flex-start;gap:6mm}
.pv-fname{font-size:15pt;font-weight:700;color:#0B1A3D}
.pv-fsub{font-size:9pt;color:#1AA3E8;font-weight:700;margin-top:1mm}
.pv-fline{width:28mm;height:1mm;background:#E8202A;margin-top:2mm}
.pv-logo{max-height:26mm;max-width:70mm;object-fit:contain}
.pv-ar{height:45mm;display:flex;justify-content:space-between}
.pv-addr{width:85mm;height:45mm;position:relative}
.pv-ret{position:absolute;left:0;right:0;top:0;height:17.7mm;display:flex;align-items:flex-end;font-size:7pt;color:#444}
.pv-ret span{border-bottom:.2mm solid #444;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:85mm}
.pv-to{position:absolute;top:17.7mm;left:0;right:0;height:27.3mm;font-size:10pt;line-height:1.3;padding-top:1mm;white-space:pre-line}
.pv-info{width:65mm;font-size:8.5pt;padding-top:4mm}
.pv-info table{border-collapse:collapse;width:100%}
.pv-info td{padding:.4mm 0;vertical-align:top}
.pv-info td:first-child{color:#555;padding-right:3mm;white-space:nowrap}
.fold{position:absolute;left:-20mm;width:6mm;height:0;border-top:.25mm solid #888}
.pv-h1{font-size:14pt;font-weight:700;margin:8mm 0 1mm;color:#0B1A3D}
.pv-bv{margin:1mm 0 4mm;font-size:9.5pt}
.pv-txt{white-space:pre-line;margin:3mm 0}
.pv-tab{width:100%;border-collapse:collapse;margin-top:3mm;font-size:9pt}
.pv-tab th{background:#0B1A3D;color:#fff;font-weight:700;padding:1.6mm 1.4mm;text-align:left;font-size:8.5pt}
.pv-tab td{padding:1.4mm 1.4mm;vertical-align:top;border-bottom:.2mm solid #d6dbe5}
.pv-tab .n{text-align:right;white-space:nowrap}
.pv-tab tr{break-inside:avoid;page-break-inside:avoid}
.pv-tab tr.tt{break-after:avoid;page-break-after:avoid}
.pv-tab tr.tt td{font-weight:700;background:#eef3fb;border-bottom:.3mm solid #1AA3E8;padding-top:2.2mm;color:#0B1A3D}
.pv-tab tr.ts td{font-weight:700;border-bottom:.4mm solid #0B1A3D}
.pv-tab tr.tx td{color:#222;font-style:italic}
.pv-tab .ds{white-space:pre-line}
.pv-tab .an{color:#666;font-size:7.5pt}
.pv-sumw{display:flex;justify-content:flex-end;margin-top:5mm;break-inside:avoid;page-break-inside:avoid}
.pv-sum{width:95mm;border-collapse:collapse;font-size:9.5pt}
.pv-sum td{padding:1.2mm 1.5mm}
.pv-sum td:last-child{text-align:right;white-space:nowrap}
.pv-sum tr.sub td{color:#444;font-size:8.5pt}
.pv-sum tr.line td{border-top:.3mm solid #0B1A3D}
.pv-sum tr.tot td{font-weight:700;font-size:11pt;background:#0B1A3D;color:#fff}
.pv-lohn{font-size:8pt;color:#444;text-align:right;margin-top:1.5mm}
.pv-end{break-inside:avoid;page-break-inside:avoid;white-space:pre-line}
.pv-sign{margin-top:6mm}
.pv-foot{position:absolute;left:25mm;right:20mm;bottom:8mm;display:flex;gap:5mm;justify-content:space-between;font-size:7pt;color:#444;border-top:.2mm solid #999;padding-top:2mm;white-space:pre-line}
@media print{
 html,body{background:#fff!important}
 body>*:not(#print){display:none!important}
 #print,#print.preview{display:block!important;position:static!important;padding:0!important;background:#fff!important;overflow:visible!important}
 .pv-bar,.pv-foot{display:none!important}
 .sheet{width:auto;min-height:0;margin:0;padding:0;box-shadow:none;zoom:1!important}
 .pv-tab thead{display:table-header-group}
}
</style>
</head>

 <img id="appLogo" alt="Logo">

<script>
'use strict';
/* =====================================================================
   FMÖ Angebot – Offline-Angebotsprogramm für SHK-Betriebe
   Eine Datei, keine Server, Daten in IndexedDB.
   ===================================================================== */
const APP = 'fmoe-angebot', APPVER = '1.0';

const DB = {
  db: null,
  open() {
    return new Promise((res, rej) => {
      const r = indexedDB.open(APP, 1);
      r.onupgradeneeded = () => {
        const d = r.result;
        for (const s of ['kv', 'materials', 'customers', 'offers', 'rabatt']) if (!d.objectStoreNames.contains(s)) d.createObjectStore(s, { keyPath: s === 'kv' ? 'k' : 'id' });
      };

      r.onerror = () => rej(r.error);
    });
  },
  req: r => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }),
  all(s) { return DB.req(DB.db.transaction(s).objectStore(s).getAll()); },
  get(s, k) { return DB.req(DB.db.transaction(s).objectStore(s).get(k)); },
  put(s, o) { return DB.putMany(s, [o]); },
  del(s, k) { return DB.delMany(s, [k]); },
  run(s, fn) {
    return new Promise((res, rej) => {
      const t = DB.db.transaction(s, 'readwrite'); fn(t.objectStore(s));
      t.oncomplete = () => res(); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
    });
  },
  putMany(s, arr) { return DB.run(s, st => { for (const o of arr) st.put(o); }); },
  delMany(s, keys) { return DB.run(s, st => { for (const k of keys) st.delete(k); }); },
  clear(s) { return DB.run(s, st => st.clear()); },

function formatNr(fmt, n, d = new Date()) {
  return String(fmt || 'AN-{JJJJ}-{NR:3}').replace(/\{JJJJ\}/g, d.getFullYear()).replace(/\{JJ\}/g, String(d.getFullYear()).slice(2))
    .replace(/\{MM\}/g, pad(d.getMonth() + 1)).replace(/\{NR(?::(\d+))?\}/g, (_, w) => pad(n, +w || 1));
}
function nextNr() {
  const st = S.settings, y = new Date().getFullYear();
  if (/\{JJ/.test(st.nrFormat) && st.nrYear !== y) { st.nrNext = 1; st.nrYear = y; }
  let nr, guard = 0;
  do { nr = formatNr(st.nrFormat, st.nrNext); st.nrNext++; } while (S.offers.some(o => o.nr === nr) && guard++ < 1000);
  saveSettings(); return nr;
}
function calc(o) {
  const res = { titles: [], nrs: [], netto0: 0, ek: 0, lohn0: 0 };
  o.titel.forEach((t, ti) => {
    let sum = 0, ek = 0, k = 0; const nrs = [];
    for (const p of t.pos) {
      if (p.typ === 'text') { nrs.push(''); continue; }
      k++; nrs.push(`${ti + 1}.${k}`);
      const gp = r2((+p.menge || 0) * (+p.ep || 0)); sum += gp; ek += (+p.menge || 0) * (+p.ek || 0);
      if (p.typ === 'arb') res.lohn0 += gp;
    }
    res.titles.push({ sum: r2(sum), ek: r2(ek) }); res.nrs.push(nrs);
    res.netto0 += sum; res.ek += ek;
  });
  res.netto0 = r2(res.netto0); res.ek = r2(res.ek);
  const rw = +o.rabattWert || 0;
  res.rab = r2(o.rabattTyp === '€' ? rw : res.netto0 * rw / 100);
  res.netto = r2(res.netto0 - res.rab);
  res.mwst = r2(res.netto * (+o.mwst || 0) / 100);
  res.brutto = r2(res.netto + res.mwst);
  res.gewinn = r2(res.netto - res.ek);
  res.marge = res.netto ? res.gewinn / res.netto * 100 : 0;
  const f = res.netto0 ? res.netto / res.netto0 : 1;
  res.lohn = r2(res.lohn0 * f * (1 + (+o.mwst || 0) / 100));
  return res;
}

function parseCSV(text, d) {
  const rows = []; let row = [], f = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; continue; }
    if (c === '"' && f === '') q = true;
    else if (c === d) { row.push(f); f = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(f); f = ''; if (row.length > 1 || row[0] !== '') rows.push(row); row = []; }
    else f += c;
  }
  if (f !== '' || row.length) { row.push(f); rows.push(row); }
  return rows;
}

      label: 'Import starten', cls: 'p', onClick: ov => {

  const get = (r, k) => map[k] >= 0 ? String(r[map[k]] ?? '').trim() : '';

  navigator.storage?.estimate?.().then(q => { const el = $('#quota'); if (el) el.textContent = `${(q.usage / 1048576).toFixed(1)} MB belegt von ${(q.quota / 1048576 / 1024).toFixed(1)} GB`; }).catch(() => { });

    if (d.g != null) { const g = s.gruppen[+d.g]; g[d.gk] = d.gk === 'pct' ? (el.value === '' ? '' : parseNum(el.value)) : el.value; rebuildGrpMap(); saveSettings(); }

    if (a === 'logodel') { s.logo = ''; await DB.kvSet('settings', s); refreshHeader(); viewSettings(); return; }

function loadImage(file) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => {
      if (/svg/.test(file.type)) return res(fr.result);
      const img = new Image();
      img.onload = () => { const max = 900, k = Math.min(1, max / Math.max(img.width, img.height)); const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); res(c.toDataURL('image/png')); };
      img.onerror = rej; img.src = fr.result;
    };
    fr.onerror = rej; fr.readAsDataURL(file);
  });
}

async function exportBackup() {
  const pr = progress('Sicherung wird erstellt…'); pr.set(.2);
  const data = { app: APP, version: APPVER, exported: new Date().toISOString(), settings: S.settings, favs: S.favs, recent: S.recent, customers: S.customers, offers: S.offers, rabatt: [...S.rab.values()], materials: S.arr.map(stripMat) };
  pr.set(.6); const json = JSON.stringify(data); pr.close();
  const d = new Date(); download(`FMOE-Sicherung-${isoToday()}-${pad(d.getHours())}${pad(d.getMinutes())}.json`, json);
  toast(`Sicherung erstellt (${(json.length / 1048576).toFixed(1)} MB)`);
}
async function importBackup() {
  const [f] = await pickFile('.json,application/json'); if (!f) return;
  let data; try { data = JSON.parse(await f.text()); } catch (e) { return modal({ title: 'Fehler', html: '<p>Die Datei ist keine gültige JSON-Sicherung.</p>' }); }
  if (data.app !== APP) return modal({ title: 'Fehler', html: '<p>Diese Datei ist keine FMÖ-Angebot-Sicherung.</p>' });
  if (!await confirmDlg(`Sicherung vom <b>${new Date(data.exported).toLocaleString('de-DE')}</b> wiederherstellen?<br><br>${data.offers?.length || 0} Angebote, ${data.customers?.length || 0} Kunden, ${(data.materials?.length || 0).toLocaleString('de-DE')} Artikel.<br><br><b>Alle aktuellen Daten werden ersetzt.</b>`, 'Wiederherstellen', true)) return;
  const pr = progress('Wiederherstellung…');
  for (const st of ['kv', 'materials', 'customers', 'offers', 'rabatt']) await DB.clear(st);
  await DB.kvSet('settings', { ...DEF, ...(data.settings || {}) }); await DB.kvSet('favs', data.favs || []); await DB.kvSet('recent', data.recent || []);
  await DB.putMany('customers', data.customers || []); await DB.putMany('offers', data.offers || []); await DB.putMany('rabatt', data.rabatt || []);
  const mats = data.materials || [];
  for (let i = 0; i < mats.length; i += 5000) { await DB.putMany('materials', mats.slice(i, i + 5000)); pr.set(i / mats.length, `${i.toLocaleString('de-DE')} / ${mats.length.toLocaleString('de-DE')} Artikel`); await sleep0(); }
  pr.close(); location.hash = '#/angebote'; location.reload();
}

async function loadDemo() {
  if (!await confirmDlg('Beispieldaten laden? Es werden 2 Beispiel-Lieferanten (DATANORM), 3 Kunden und 2 Angebote hinzugefügt. Vorhandene Daten bleiben erhalten.', 'Laden')) return;
  const pr = progress('Beispieldaten…');
  const st = [];
  for (const [sup, txt] of [['GC Gienger (Beispiel)', SAMPLE_DN_GC], ['Weinmann & Schanz (Beispiel)', SAMPLE_DN_WS]]) {
    const imp = new DNImporter(sup); txt.split(/\r?\n/).forEach(l => imp.line(l)); await imp.flush(true); st.push(imp.st);
  }
  rebuildArr(); pr.set(.5);
  const s = S.settings;
  if (!s.gruppen.length) s.gruppen = [{ code: '10', name: 'Sanitär-Installation', pct: 25 }, { code: '11', name: 'Sanitärkeramik', pct: 22 }, { code: '12', name: 'Armaturen', pct: 22 }, { code: '20', name: 'Rohre & Fittings', pct: 35 }, { code: '30', name: 'Wärmeerzeuger', pct: 15 }, { code: '31', name: 'Heizkörper', pct: 20 }, { code: '40', name: 'Klimatechnik', pct: 18 }];
  rebuildGrpMap(); await DB.kvSet('settings', s);
  const cs = [
    { id: uid(), anrede: 'Herr', vorname: 'Thomas', nachname: 'Müller', strasse: 'Lindenstraße 12', plz: '44135', ort: 'Dortmund', tel: '0231 123456', email: 'thomas.mueller@example.de', notiz: 'Beispielkunde' },
    { id: uid(), anrede: 'Frau', firma: 'Hausverwaltung Schneider GmbH', vorname: 'Petra', nachname: 'Schneider', strasse: 'Am Markt 3', plz: '45127', ort: 'Essen', tel: '0201 987654', email: 'info@hv-schneider.example', notiz: 'Beispielkunde' },
    { id: uid(), anrede: 'Frau', vorname: 'Ayşe', nachname: 'Yılmaz', strasse: 'Rosenweg 7', plz: '44787', ort: 'Bochum', tel: '0234 555123', email: 'a.yilmaz@example.de', notiz: 'Beispielkunde' }];
  for (const c of cs) { S.customers.push(c); } await DB.putMany('customers', cs);
  const G = 'GC Gienger (Beispiel)|';
  const M = id => S.mats.get(G + id);
  const P = (id, q) => { const m = M(id); return m ? posFromMat(m, q) : null; };
  const A = (text, h) => ({ id: uid(), typ: 'arb', text, menge: h, einheit: 'Std', ep: +s.stundensatz, ek: 0 });
  const PS = (text, ep, ek = 0) => ({ id: uid(), typ: 'pausch', text, menge: 1, einheit: 'psch', ep, ek });
  const TX = text => ({ id: uid(), typ: 'text', text });
  const o1 = newOffer(cs[0]);
  o1.bauvorhaben = 'Badsanierung EG, Lindenstraße 12, 44135 Dortmund'; o1.betreff = 'Komplettsanierung Badezimmer'; o1.status = 'gesendet'; o1.rabattWert = 3;
  o1.titel = [
    { id: uid(), name: 'Demontage', pos: [PS('Demontage der vorhandenen Sanitärobjekte (WC, Waschtisch, Badewanne) inkl. Abtransport und fachgerechter Entsorgung', 480, 120), A('Rückbau alter Rohrleitungen, Abdichten der Anschlüsse', 4)] },
    { id: uid(), name: 'Bad', pos: [P('111.300.00.5', 1), P('115.882.KH.1', 1), P('5660100', 1), P('9M68S101', 1), P('7175A001', 1), P('23324001', 1), P('26425000', 1), P('136270', 12), P('KUPF15-50', 15), P('10000134', 15), P('16124', 3), A('Montage Vorwandelemente, Sanitärobjekte und Armaturen', 16), TX('Fliesenarbeiten, Trockenbau und Elektroarbeiten bauseits.')].filter(Boolean) }];
  const o2 = newOffer(cs[1]);
  o2.bauvorhaben = 'MFH Am Markt 3, 45127 Essen – Heizungszentrale Keller'; o2.betreff = 'Heizungsmodernisierung Gas-Brennwert'; o2.rabattTyp = '€'; o2.rabattWert = 250;
  o2.titel = [
    { id: uid(), name: 'Heizung', pos: [P('0010021965', 1), P('4215513', 1), P('7213200', 1), PS('Abgasanlage: Kunststoff-Abgassystem DN 80/125 inkl. Formteile und Montage', 1150, 690), A('Demontage Altkessel, Montage und Inbetriebnahme Brennwertgerät', 14), PS('Hydraulischer Abgleich nach Verfahren B inkl. Berechnung und Dokumentation', 690, 0)].filter(Boolean) },
    { id: uid(), name: 'Heizkörper', pos: [P('FK0220610', 3), P('2111-02.000', 3), P('013G6070', 3), P('136294', 18), A('Heizkörpertausch inkl. Anschlussarbeiten', 6)].filter(Boolean) },
    { id: uid(), name: 'Hinweise', pos: [TX('Förderfähigkeit nach BEG EM wird gerne geprüft. Der Schornsteinfeger-Abnahmetermin wird von uns koordiniert.')] }];
  S.offers.push(o1, o2); await DB.putMany('offers', [o1, o2]); setCur(o2.id);
  pr.close();
  toast(`Beispieldaten geladen: ${S.arr.length} Artikel, 2 Angebote`);
  go('#/angebote');
}

async function init() {
  try { await DB.open(); } catch (e) { view.innerHTML = `<div class="card empty"><b>Datenbank nicht verfügbar</b>${esc(e.message || e)}<br>Bitte Browser-Einstellungen prüfen (privater Modus?).</div>`; return; }
  S.settings = { ...DEF, ...(await DB.kvGet('settings') || {}) };
  S.favs = await DB.kvGet('favs') || []; S.recent = await DB.kvGet('recent') || []; S.cur = await DB.kvGet('cur') || null;
  const iv = await DB.kvGet('intern'); S.intern = iv == null ? true : iv; document.body.classList.toggle('nointern', !S.intern);
  rebuildGrpMap();
  S.customers = await DB.all('customers'); S.offers = await DB.all('offers');
  for (const r of await DB.all('rabatt')) S.rab.set(r.id, r);
  for (const m of await DB.all('materials')) { m._s = sstr(m); S.mats.set(m.id, m); }
  rebuildArr(); refreshHeader();
  $('#curChip').onclick = () => { const o = curOffer(); if (o) go('#/angebot/' + o.id); };
  window.addEventListener('hashchange', route); route();
  navigator.storage?.persist?.().catch(() => { });
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => { });
}
init();
